<body>
    <div id="cn-boot-reveal" role="status" aria-label="Cuidanet">
        <div class="cn-boot-reveal__stage">
            <img src="LogoCuidaNet.png" alt="Cuidanet" />
        </div>
    </div>

    <div id="app">
        <div class="cn-boot" role="status" aria-label="Cuidanet">
            <img class="cn-boot__logo" src="LogoCuidaNet.png" alt="Cuidanet" />
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error al cargar la app.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
        <div id="blazor-error-detail" style="margin-top:0.5rem;font-size:12px;opacity:0.85;max-width:28rem;"></div>
    </div>

    <script>
        // Deep links de GitHub Pages (/reembolso) vuelven al index con la ruta guardada.
        (function restoreSpaPath() {
            try {
                var path = sessionStorage.getItem('cn_restore_path');
                if (path) {
                    sessionStorage.removeItem('cn_restore_path');
                    history.replaceState(null, '', path);
                }
            } catch (e) { /* sessionStorage bloqueado */ }
        })();

        // Limpia Service Workers / caches viejos (causan "unhandled error" tras cada deploy).
        (async function clearStalePwa() {
            const flag = 'cn_cache_bust_20260818a';
            try {
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(function (r) { return r.unregister(); }));
                }
                if (window.caches && caches.keys) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }
            } catch (e) {
                console.warn('PWA cache clear:', e);
            }

            // Recargar el index (200), no la ruta Blazor (GitHub Pages responde 404).
            try {
                if (!sessionStorage.getItem(flag)) {
                    sessionStorage.setItem(flag, '1');
                    sessionStorage.setItem(
                        'cn_restore_path',
                        location.pathname + location.search + location.hash);
                    var base = document.querySelector('base');
                    location.replace((base && base.href) ? base.href : './');
                    return;
                }
            } catch (e) { /* sessionStorage bloqueado */ }
        })();
    </script>

    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // GitHub Pages no sirve .br con Content-Encoding; usa el archivo plano.
                if (defaultUri && defaultUri.endsWith('.br')) {
                    defaultUri = defaultUri.replace(/\.br$/, '');
                }

                try {
                    var mapEl = document.querySelector('script[type="importmap"]');
                    var imports = mapEl ? (JSON.parse(mapEl.textContent || '{}').imports || {}) : {};
                    var file = (name || defaultUri).split('?')[0].split('/').pop();
                    for (var key in imports) {
                        if (key.split('/').pop() === file) {
                            defaultUri = new URL(imports[key], document.baseURI).href;
                            break;
                        }
                    }
                } catch (e) { /* importmap ausente o inválido */ }

                // Siempre URI string. Devolver fetch() rompe Mono
                // (MONO_WASM: s is not a function en mono_download_assets).
                return defaultUri;
            }
        }).catch(function (err) {
            console.error('Blazor.start failed', err);
            var ui = document.getElementById('blazor-error-ui');
            var detail = document.getElementById('blazor-error-detail');
            if (ui) ui.style.display = 'block';
            if (detail) detail.textContent = (err && err.message) ? err.message : String(err);
        });
    </script>

    <!-- Service Worker desactivado temporalmente para evitar WASM en caché tras deploys.
         Se puede volver a activar cuando la app esté estable. -->
    <!-- <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script> -->

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script>
        window.BlazorSmsOtp = {
            _controller: null,
            hostname: function () {
                return window.location.hostname || '';
            },
            isIos: function () {
                var ua = navigator.userAgent || '';
                if (/iPad|iPhone|iPod/.test(ua)) return true;
                // iPadOS 13+ se reporta como MacIntel con touch
                return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
            },
            webOtpSupported: function () {
                return ('OTPCredential' in window) && !!(navigator.credentials && navigator.credentials.get);
            },
            focusCodigo: function (id) {
                var el = document.getElementById(id);
                if (!el) return false;
                try {
                    el.focus({ preventScroll: false });
                    if (typeof el.setSelectionRange === 'function') {
                        var len = (el.value || '').length;
                        el.setSelectionRange(len, len);
                    }
                } catch (_) {
                    try { el.focus(); } catch (__) { /* ignore */ }
                }
                return document.activeElement === el;
            },
            listen: async function () {
                this.abort();
                if (!this.webOtpSupported()) {
                    return null;
                }
                this._controller = new AbortController();
                try {
                    const cred = await navigator.credentials.get({
                        otp: { transport: ['sms'] },
                        signal: this._controller.signal
                    });
                    return (cred && cred.code) ? String(cred.code) : null;
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        return null;
                    }
                    console.warn('Web OTP no disponible:', err);
                    return null;
                } finally {
                    this._controller = null;
                }
            },
            abort: function () {
                if (this._controller) {
                    try { this._controller.abort(); } catch (_) { /* ignore */ }
                    this._controller = null;
                }
            }
        };

        window.BlazorCamera = {
            start: async (videoId) => {
                try {
                    const video = document.getElementById(videoId);
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }, // Prioriza la cámara trasera en móviles
                        audio: false
                    });
                    video.srcObject = stream;
                    video.play();
                    return true;
                } catch (err) {
                    console.error("Error accediendo a la cámara: ", err);
                    return false;
                }
            },
            capture: (videoId, canvasId) => {
                const video = document.getElementById(videoId);
                const canvas = document.getElementById(canvasId);
                const context = canvas.getContext('2d');

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Retorna la imagen en formato Base64 comprimida como JPEG
                return canvas.toDataURL('image/jpeg', 0.85);
            }
        };

        // Vista a pantalla completa sin mostrar la ruta física /Imagenes/...
        window.CuidanetUi = {
            openUrlHidden: function (url) {
                if (!url) return false;
                var w = window.open('about:blank', '_blank');
                if (!w) return false;

                var isPdf = /\.pdf(\?|#|$)/i.test(url) || /^data:application\/pdf/i.test(url);
                var isServir = /ServirAdjunto/i.test(url);
                var useFrame = isPdf || isServir;

                // Escapar solo lo necesario para atributo HTML (data: URLs no deben romperse).
                var safe = String(url)
                    .replace(/&/g, '&amp;')
                    .replace(/"/g, '&quot;')
                    .replace(/</g, '&lt;');

                var body = useFrame
                    ? '<iframe class="doc" src="' + safe + '" title="Documento" allowfullscreen></iframe>'
                    : '<img class="doc" src="' + safe + '" alt="Documento" />';

                w.document.open();
                w.document.write(
                    '<!DOCTYPE html><html><head><meta charset="utf-8">' +
                    '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">' +
                    '<title>Documento</title>' +
                    '<style>' +
                    '*{box-sizing:border-box;}' +
                    'html,body{margin:0;padding:0;width:100%;height:100%;background:#000;}' +
                    'body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch;}' +
                    'img.doc{display:block;width:100%;max-width:100vw;height:auto;max-height:100vh;max-height:100dvh;object-fit:contain;margin:auto;}' +
                    'iframe.doc{display:block;border:0;width:100vw;height:100vh;height:100dvh;}' +
                    '</style></head><body>' + body + '</body></html>'
                );
                w.document.close();
                return true;
            }
        };

        window.BlazorOcr = {
            analizarDocumento: async function (imageSrc, lang = 'spa') {
                try {
                    // Creamos el worker de Tesseract configurado en español
                    const worker = await Tesseract.createWorker(lang);

                    // Realizamos el reconocimiento de la imagen (acepta URL base64 o blob URL)
                    const { data: { text } } = await worker.recognize(imageSrc);

                    // Destruimos el worker para liberar memoria en el navegador
                    await worker.terminate();

                    // Normalizamos el texto para facilitar la validación de palabras clave
                    const textoNormalizado = text.toLowerCase();

                    // Criterios de validación (puedes expandir esta lista)
                    const esValido = textoNormalizado.includes("recipe") ||
                        textoNormalizado.includes("récipe") ||
                        textoNormalizado.includes("diagnostico") ||
                        textoNormalizado.includes("diagnóstico") ||
                        textoNormalizado.includes("rp:") ||
                        textoNormalizado.includes("indicaciones");

                    return {
                        exito: true,
                        textoExtraido: text,
                        esDocumentoValido: esValido
                    };
                } catch (error) {
                    console.error("Error en Tesseract.js:", error);
                    return {
                        exito: false,
                        textoExtraido: "",
                        esDocumentoValido: false
                    };
                }
            }
        };

    </script>
    <script>
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            // Previene que el navegador muestre su barra nativa automática
            e.preventDefault();
            deferredPrompt = e;

            // Notifica a Blazor que la App es instalable y no está instalada aún
            if (window.dotNetInstallHelper) {
                window.dotNetInstallHelper.invokeMethodAsync('MostrarBannerInstalacion');
            }
        });

        window.registrarHelperInstalacion = (dotNetHelper) => {
            window.dotNetInstallHelper = dotNetHelper;
            // Diferir el callback para no reentrar durante OnAfterRender de Blazor
            if (deferredPrompt) {
                setTimeout(() => {
                    try {
                        dotNetHelper.invokeMethodAsync('MostrarBannerInstalacion');
                    } catch (e) {
                        console.warn('PWA banner helper:', e);
                    }
                }, 0);
            }
        };

        window.promptInstalarPwa = async () => {
            if (!deferredPrompt) return false;

            // Muestra el prompt nativo de instalación
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;

            return outcome === 'accepted';
        };
    </script>
</body>

</html>
