<body>
    <div id="cn-boot-reveal" role="status" aria-label="Cuidanet">
        <div class="cn-boot-reveal__stage">
            <img src="LogoCuidaNet.png" alt="Cuidanet" />
        </div>
    </div>

    <div id="app">
        <div class="cn-boot" role="status" aria-label="Cuidanet">
            <img class="cn-boot__logo" src="LogoCuidaNet.png" alt="Cuidanet" />
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error al cargar la app.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
        <div id="blazor-error-detail" style="margin-top:0.5rem;font-size:12px;opacity:0.85;max-width:28rem;"></div>
    </div>

    <script>
        // Deep links de GitHub Pages (/reembolso) vuelven al index con la ruta guardada.
        (function restoreSpaPath() {
            try {
                var path = sessionStorage.getItem('cn_restore_path');
                if (path) {
                    sessionStorage.removeItem('cn_restore_path');
                    history.replaceState(null, '', path);
                }
            } catch (e) { /* sessionStorage bloqueado */ }
        })();

        // Una sola limpieza por versión (caches offline viejos). No desregistrar SW en cada carga.
        (async function clearStalePwaOnce() {
            var flag = 'cn_pwa_bust_20260821a';
            try {
                if (localStorage.getItem(flag)) return;
                if (window.caches && caches.keys) {
                    var keys = await caches.keys();
                    await Promise.all(keys
                        .filter(function (k) { return k.indexOf('offline-cache-') === 0; })
                        .map(function (k) { return caches.delete(k); }));
                }
                localStorage.setItem(flag, '1');
                try {
                    sessionStorage.setItem(
                        'cn_restore_path',
                        location.pathname + location.search + location.hash);
                } catch (e2) { /* sessionStorage bloqueado */ }
                var base = document.querySelector('base');
                location.replace((base && base.href) ? base.href : './');
            } catch (e) {
                console.warn('PWA cache clear:', e);
            }
        })();
    </script>

    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        function cnResolveBootUri(name, defaultUri) {
            if (defaultUri && defaultUri.endsWith('.br')) {
                defaultUri = defaultUri.replace(/\.br$/, '');
            }
            try {
                var mapEl = document.querySelector('script[type="importmap"]');
                var imports = mapEl ? (JSON.parse(mapEl.textContent || '{}').imports || {}) : {};
                var file = (name || defaultUri).split('?')[0].split('/').pop();
                for (var key in imports) {
                    if (key.split('/').pop() === file) {
                        return new URL(imports[key], document.baseURI).href;
                    }
                }
            } catch (e) { /* importmap ausente o inválido */ }
            return defaultUri;
        }

        function cnIsHtmlResponse(res) {
            var ct = (res.headers.get('content-type') || '').toLowerCase();
            return ct.indexOf('text/html') !== -1;
        }

        async function cnFetchBootResource(url) {
            var delays = [0, 600, 1500, 3000, 6000];
            var lastErr;
            for (var i = 0; i < delays.length; i++) {
                if (delays[i]) {
                    await new Promise(function (resolve) { setTimeout(resolve, delays[i]); });
                }
                var attemptUrl = i === 0
                    ? url
                    : url + (url.indexOf('?') >= 0 ? '&' : '?') + 'cnr=' + i;
                try {
                    // Sin integrity: un 503 HTML de GitHub Pages no debe bloquear la URL por SRI.
                    var res = await fetch(attemptUrl, { cache: 'no-store' });
                    if (res.ok && !cnIsHtmlResponse(res)) return res;
                    lastErr = new Error('HTTP ' + res.status + ' ' + url);
                } catch (e) {
                    lastErr = e;
                }
            }
            throw lastErr;
        }

        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                var uri = cnResolveBootUri(name, defaultUri);

                // dotnetjs EXIGE URI string. Devolver fetch() ahí rompe Mono
                // (MONO_WASM: s is not a function en mono_download_assets).
                if (type === 'dotnetjs') {
                    return uri;
                }

                return cnFetchBootResource(uri);
            }
        }).catch(function (err) {
            console.error('Blazor.start failed', err);
            var ui = document.getElementById('blazor-error-ui');
            var detail = document.getElementById('blazor-error-detail');
            if (ui) ui.style.display = 'block';
            if (detail) detail.textContent = (err && err.message) ? err.message : String(err);
        });
    </script>

    <script>
        // SW en red (sin caché WASM). Necesario para beforeinstallprompt / instalar PWA.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker
                    .register('service-worker.js', { updateViaCache: 'none', scope: './' })
                    .catch(function (err) { console.warn('SW register:', err); });
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script>
        window.BlazorSmsOtp = {
            _controller: null,
            hostname: function () {
                return window.location.hostname || '';
            },
            isIos: function () {
                var ua = navigator.userAgent || '';
                if (/iPad|iPhone|iPod/.test(ua)) return true;
                // iPadOS 13+ se reporta como MacIntel con touch
                return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
            },
            webOtpSupported: function () {
                return ('OTPCredential' in window) && !!(navigator.credentials && navigator.credentials.get);
            },
            focusCodigo: function (id) {
                var el = document.getElementById(id);
                if (!el) return false;
                try {
                    el.focus({ preventScroll: false });
                    if (typeof el.setSelectionRange === 'function') {
                        var len = (el.value || '').length;
                        el.setSelectionRange(len, len);
                    }
                } catch (_) {
                    try { el.focus(); } catch (__) { /* ignore */ }
                }
                return document.activeElement === el;
            },
            listen: async function () {
                this.abort();
                if (!this.webOtpSupported()) {
                    return null;
                }
                this._controller = new AbortController();
                try {
                    const cred = await navigator.credentials.get({
                        otp: { transport: ['sms'] },
                        signal: this._controller.signal
                    });
                    return (cred && cred.code) ? String(cred.code) : null;
                } catch (err) {
                    if (err && err.name === 'AbortError') {
                        return null;
                    }
                    console.warn('Web OTP no disponible:', err);
                    return null;
                } finally {
                    this._controller = null;
                }
            },
            abort: function () {
                if (this._controller) {
                    try { this._controller.abort(); } catch (_) { /* ignore */ }
                    this._controller = null;
                }
            }
        };

        window.BlazorCamera = {
            start: async (videoId) => {
                try {
                    const video = document.getElementById(videoId);
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }, // Prioriza la cámara trasera en móviles
                        audio: false
                    });
                    video.srcObject = stream;
                    video.play();
                    return true;
                } catch (err) {
                    console.error("Error accediendo a la cámara: ", err);
                    return false;
                }
            },
            capture: (videoId, canvasId) => {
                const video = document.getElementById(videoId);
                const canvas = document.getElementById(canvasId);
                const context = canvas.getContext('2d');

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Retorna la imagen en formato Base64 comprimida como JPEG
                return canvas.toDataURL('image/jpeg', 0.85);
            }
        };

        // Vista a pantalla completa sin mostrar la ruta física /Imagenes/...
        window.CuidanetUi = {
            openUrlHidden: function (url) {
                if (!url) return false;
                var w = window.open('about:blank', '_blank');
                if (!w) return false;

                var isPdf = /\.pdf(\?|#|$)/i.test(url) || /^data:application\/pdf/i.test(url);
                var isServir = /ServirAdjunto/i.test(url);
                var useFrame = isPdf || isServir;

                // Escapar solo lo necesario para atributo HTML (data: URLs no deben romperse).
                var safe = String(url)
                    .replace(/&/g, '&amp;')
                    .replace(/"/g, '&quot;')
                    .replace(/</g, '&lt;');

                var body = useFrame
                    ? '<iframe class="doc" src="' + safe + '" title="Documento" allowfullscreen></iframe>'
                    : '<img class="doc" src="' + safe + '" alt="Documento" />';

                w.document.open();
                w.document.write(
                    '<!DOCTYPE html><html><head><meta charset="utf-8">' +
                    '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">' +
                    '<title>Documento</title>' +
                    '<style>' +
                    '*{box-sizing:border-box;}' +
                    'html,body{margin:0;padding:0;width:100%;height:100%;background:#000;}' +
                    'body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch;}' +
                    'img.doc{display:block;width:100%;max-width:100vw;height:auto;max-height:100vh;max-height:100dvh;object-fit:contain;margin:auto;}' +
                    'iframe.doc{display:block;border:0;width:100vw;height:100vh;height:100dvh;}' +
                    '</style></head><body>' + body + '</body></html>'
                );
                w.document.close();
                return true;
            }
        };

        window.BlazorOcr = {
            analizarDocumento: async function (imageSrc, lang = 'spa') {
                try {
                    // Creamos el worker de Tesseract configurado en español
                    const worker = await Tesseract.createWorker(lang);

                    // Realizamos el reconocimiento de la imagen (acepta URL base64 o blob URL)
                    const { data: { text } } = await worker.recognize(imageSrc);

                    // Destruimos el worker para liberar memoria en el navegador
                    await worker.terminate();

                    // Normalizamos el texto para facilitar la validación de palabras clave
                    const textoNormalizado = text.toLowerCase();

                    // Criterios de validación (puedes expandir esta lista)
                    const esValido = textoNormalizado.includes("recipe") ||
                        textoNormalizado.includes("récipe") ||
                        textoNormalizado.includes("diagnostico") ||
                        textoNormalizado.includes("diagnóstico") ||
                        textoNormalizado.includes("rp:") ||
                        textoNormalizado.includes("indicaciones");

                    return {
                        exito: true,
                        textoExtraido: text,
                        esDocumentoValido: esValido
                    };
                } catch (error) {
                    console.error("Error en Tesseract.js:", error);
                    return {
                        exito: false,
                        textoExtraido: "",
                        esDocumentoValido: false
                    };
                }
            }
        };

    </script>
    <script>
        (function () {
            var deferredPrompt = null;
            var helpers = [];

            function isIos() {
                var ua = navigator.userAgent || '';
                if (/iPad|iPhone|iPod/.test(ua)) return true;
                return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
            }

            function isInstalled() {
                try {
                    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
                        return true;
                    }
                } catch (e) { /* ignore */ }
                if (navigator.standalone === true) return true;
                try {
                    if (window.matchMedia && window.matchMedia('(display-mode: window-controls-overlay)').matches) {
                        return true;
                    }
                } catch (e2) { /* ignore */ }
                return false;
            }

            var dismissKey = 'cn_pwa_dismiss_until';

            function isDismissed() {
                try {
                    var until = parseInt(localStorage.getItem(dismissKey) || '0', 10);
                    return !!until && Date.now() < until;
                } catch (e) {
                    return false;
                }
            }

            function getState() {
                return {
                    installed: isInstalled(),
                    canPrompt: !!deferredPrompt,
                    isIos: isIos(),
                    dismissed: isDismissed()
                };
            }

            function notifyHelpers() {
                var state = getState();
                helpers.forEach(function (h) {
                    try {
                        h.invokeMethodAsync('OnPwaStateChanged', state);
                    } catch (e) {
                        console.warn('PWA helper:', e);
                    }
                });
            }

            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                deferredPrompt = e;
                notifyHelpers();
            });

            window.addEventListener('appinstalled', function () {
                deferredPrompt = null;
                try { localStorage.removeItem(dismissKey); } catch (e) { /* ignore */ }
                notifyHelpers();
            });

            window.cuidanetPwa = {
                getState: getState,
                bind: function (dotNetHelper) {
                    if (helpers.indexOf(dotNetHelper) < 0) {
                        helpers.push(dotNetHelper);
                    }
                    try {
                        dotNetHelper.invokeMethodAsync('OnPwaStateChanged', getState());
                    } catch (e) {
                        console.warn('PWA helper:', e);
                    }
                },
                unbind: function (dotNetHelper) {
                    if (!dotNetHelper) {
                        helpers = [];
                        return;
                    }
                    helpers = helpers.filter(function (h) { return h !== dotNetHelper; });
                },
                dismiss: function (days) {
                    var d = typeof days === 'number' && days > 0 ? days : 14;
                    try {
                        localStorage.setItem(dismissKey, String(Date.now() + d * 24 * 60 * 60 * 1000));
                    } catch (e) { /* ignore */ }
                    notifyHelpers();
                },
                install: async function () {
                    if (isInstalled()) {
                        return { outcome: 'accepted', mode: 'native' };
                    }
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        var choice = await deferredPrompt.userChoice;
                        deferredPrompt = null;
                        notifyHelpers();
                        return { outcome: choice.outcome, mode: 'native' };
                    }
                    if (isIos()) {
                        return { outcome: 'manual', mode: 'ios' };
                    }
                    return { outcome: 'manual', mode: 'browser' };
                }
            };

            // Compatibilidad con layouts antiguos
            window.registrarHelperInstalacion = function (dotNetHelper) {
                window.cuidanetPwa.bind(dotNetHelper);
            };
            window.promptInstalarPwa = async function () {
                var r = await window.cuidanetPwa.install();
                return !!(r && r.mode === 'native' && r.outcome === 'accepted');
            };
        })();
    </script>
